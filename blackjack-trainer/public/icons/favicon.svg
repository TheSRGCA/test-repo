<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="felt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d5c2e"/>
      <stop offset="100%" style="stop-color:#094422"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#felt)"/>

  <!-- Card 1 (Ace of Spades) - tilted left -->
  <g transform="translate(100, 120) rotate(-15, 80, 120)">
    <rect width="160" height="240" rx="12" fill="white" stroke="#ddd" stroke-width="2"/>
    <text x="20" y="50" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#1a1a1a">A</text>
    <text x="80" y="150" font-family="Arial" font-size="80" fill="#1a1a1a" text-anchor="middle">♠</text>
  </g>

  <!-- Card 2 (Jack of Hearts) - tilted right -->
  <g transform="translate(250, 150) rotate(15, 80, 120)">
    <rect width="160" height="240" rx="12" fill="white" stroke="#ddd" stroke-width="2"/>
    <text x="20" y="50" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#dc2626">J</text>
    <text x="80" y="150" font-family="Arial" font-size="80" fill="#dc2626" text-anchor="middle">♥</text>
  </g>

  <!-- "21" Badge -->
  <circle cx="400" cy="420" r="70" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
  <text x="400" y="440" font-family="Arial Black, sans-serif" font-size="50" font-weight="bold" fill="#1a1a1a" text-anchor="middle">21</text>
</svg>
